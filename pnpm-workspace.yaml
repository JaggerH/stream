packages:
  - app

# pnpm 10+ blocks dependency build/postinstall scripts by default. Allow the two that need to
# run: better-sqlite3 (native — prebuild-install fetches a prebuilt .node, no toolchain) and
# esbuild (postinstall unpacks its platform binary). This map is where pnpm reads the allowlist
# (`pnpm approve-builds` writes it here); the `pnpm.onlyBuiltDependencies` field in package.json
# is ignored by this pnpm. The Docker image MUST copy this file before `pnpm install` or the
# builds are skipped there (that was the empty-better-sqlite3 bug).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  isolated-vm: true
  rolldown: true
  sharp: true

# 容器里 lockfile 变了之后,pnpm 的启动前 deps 检查会想清空匿名卷重装;无 TTY 时它默认
# abort,后端直接 crash-loop(2026-07-26 实锤)。允许免确认清卷,让容器自愈。
confirmModulesPurge: false

