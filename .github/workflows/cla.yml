name: cla

# 外部贡献须签 CLA（见 CLA.md）：PR 开启时机器人回帖要求签署，贡献者在 PR 下按固定句式回复即完成，
# 签名记在 cla-signatures 分支的 signatures/cla.json。维护者本人与依赖机器人在 allowlist 里，不用签。
#
# 用 pull_request_target 是这个 action 的要求（要能往 PR 回帖、写签名分支）。它**不 checkout PR 的代码**，
# 所以不存在「外部 PR 借 target 的权限跑自己代码」的风险——别在这个 job 里加 checkout。
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/JaggerH/stream/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: JaggerH,dependabot[bot],renovate[bot]
