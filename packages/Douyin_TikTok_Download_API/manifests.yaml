# ------------------------------------------------------------------ douyin (handlers)
# douyin-collection 已迁到 recipes/douyin/（登录态浏览器：进收藏页拦第一发 listcollection，
# 其余批次在页内调站点自己的签名客户端）。这里的 HTTP 端点是死路：
# `/aweme/v1/web/aweme/listcollection/` 恒 403 `Blocked by ArgusSecurityPlugin`——它挪到 Argus
# 那套签名头（X-Argus/X-Gorgon/X-Ladon）后面了，和 bogus 无关（X-Bogus 与 a_bogus × GET/POST
# 四种组合实测同样的 403），上游 video-service 至今没有任何 Argus 实现。
# douyin-follow 已迁到本包的 douyin-follow.recipe.json（登录态浏览器，页内调站点自己的签名客户端打
# `/aweme/v1/web/follow/feed/`）。这里以前那条 HTTP 成员打的是容器的 `/api/douyin/web/fetch_follow_feed`，
# 而那个端点**在 fork 的 stream-backend 分支里根本不存在**——活体 2026-09-22 回 `HTTP 404: Not Found`，
# 也就是说它从来没成功过。源 id 没变，已有订阅照常。
# douyin-search 已迁到 recipes/douyin/（登录态浏览器拦 XHR）。这里的 HTTP 搜索端点是死路：
# 无 cookie → 内层 status_code 2483「请先登录」（外层还是 200，静默空列表）；带 cookie →
# douyin 的 cookie 有 7KB+，塞进 query 会被上游 h11 判为 Invalid HTTP request。
# douyin-user 已迁到本包的 douyin-user.recipe.json（登录态浏览器，页内调站点自己的签名客户端打
# `/aweme/v1/web/aweme/post/`）。这里的 HTTP 端点是死路：容器打上游恒 403
# `Blocked by ArgusSecurityPlugin`——和 listcollection / aweme-detail 同一道闸，与 cookie 新旧无关
# （活体 2026-09-22：整份登录 cookie 递进容器直打，同样 403）。源 id 没变，已有订阅照常。
# `sec_user_id` 也不再需要容器的 get_sec_user_id 解析：主页链接交给浏览器，落地后从 pathname 里读。
- id: douyin-resolve
  adapter: Douyin_TikTok_Download_API
  title: 抖音视频解析
  description: 抖音作品播放解析（作品 id → play_addr 直连 CDN，带 Referer，range 串流）；video-douyin Provider 行的成员。
  topics: [douyin, 抖音, 视频, 播放, 解析]
  categories: [video]
  capabilities: [anchor]
  facility: { key: douyin, label: 抖音 }
  auth: { type: none }
  discoverable: false
  cadence_hint_seconds: 3600
  # 这条成员不再打容器，它跑的是本包的 douyin-detail recipe（在用户自己的 Chrome 里开作品页、
  # 让页面自己算签名）——**比容器那条慢一个量级，默认 25s 的并发成员闸会在它跑完之前把结果丢掉**。
  # 活体 2026-09-23 07:59 真撞上：recipe 还在重试循环里（作品页那一发 aweme/detail 迟迟不落地），
  # 扇出层 24s 就报 `timed out after 25000ms`，用户侧表现成「解析失败」，而 recipe 自己什么都没做错。
  # 预算：进场 2–4.5s + 最多 5 轮重试 × max(minActionIntervalMs 2000, 900+抖动) + 每轮最多 8s 的调用，
  # 上限由 recipe 的 maxTaskMs 30s 封住；再加上 lane 排队，按源申报 60s（与 douyin-search 同档）。
  # **只慢自己这一格**，别的源照常 25s。
  member_timeout_ms: 60000
  api: { handler: douyin-resolve } # vid → 主站链接 → 本包的 douyin-detail recipe（容器那条被 Argus 挡死）
  params_schema:
    vid: { type: string, required: true, description: "作品 id（aweme_id）" }
    format: { type: string, required: false, description: "progressive | dash | audio（dash 如实回空）" }
- id: douyin-fetch-url
  adapter: Douyin_TikTok_Download_API
  title: 抖音链接抓媒体
  description: 一条抖音作品链接（主站 / 分享 / 短链）→ 标题 / 作者 / 可播放地址与图集；content.enrich 按 douyin-link 派发到它（douyin-url Provider 行的成员；链接归属由 stream.links 声明）。
  topics: [douyin, 抖音, 链接, 媒体, 抓取]
  categories: [transform]
  facility: { key: douyin, label: 抖音 }
  auth: { type: none }
  discoverable: false
  cadence_hint_seconds: 3600
  # 一条链接只有一份媒体结果——成员合同是单个对象，不是数组（见 docs/PACKAGE.md §2.3 output）。
  output: object
  # 这条成员不再打容器，它跑的是本包的 douyin-detail recipe（在用户自己的 Chrome 里开作品页、
  # 让页面自己算签名）——**比容器那条慢一个量级，默认 25s 的并发成员闸会在它跑完之前把结果丢掉**。
  # 活体 2026-09-23 07:59 真撞上：recipe 还在重试循环里（作品页那一发 aweme/detail 迟迟不落地），
  # 扇出层 24s 就报 `timed out after 25000ms`，用户侧表现成「解析失败」，而 recipe 自己什么都没做错。
  # 预算：进场 2–4.5s + 最多 5 轮重试 × max(minActionIntervalMs 2000, 900+抖动) + 每轮最多 8s 的调用，
  # 上限由 recipe 的 maxTaskMs 30s 封住；再加上 lane 排队，按源申报 60s（与 douyin-search 同档）。
  # **只慢自己这一格**，别的源照常 25s。
  member_timeout_ms: 60000
  api: { handler: douyin-fetch-url } # url → 本包的 douyin-detail recipe → FetchUrlResult
  params_schema:
    url: { type: string, required: true, description: "作品链接（www.douyin.com / v.douyin.com / iesdouyin.com）" }
