<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stream · 识别 profile</title>
    <!-- 认领页（browser-identity D3）：Stream 经 host agent 用某个 profile 打开 claim.html#n=<nonce>。
         样式写在这里、不引 tailwind：一张只显示一行字的页面，不值得拖进整套 UI。 -->
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1c1c1e; color: #f2f2f7;
             font: 15px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      main { max-width: 480px; padding: 24px; text-align: center; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      #detail { color: #aeaeb2; font-size: 13px; }
      .ok h1 { color: #30d158; }
      .err h1 { color: #ff453a; }
    </style>
  </head>
  <body>
    <main id="box">
      <h1 id="status">正在识别这个 profile…</h1>
      <div id="detail">稍等片刻，Stream 正在确认这个浏览器 profile 是谁。</div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
