[package]
name = "stream-ios-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "On-device iOS executor core: transport, op dispatch, capability negotiation and the safety gate"
publish = false

[features]
default = []
# The idevice-backed transport and service clients. Kept optional so protocol-layer
# tests run on any host; CI builds it on Linux and on the iOS target.
device = ["dep:idevice", "dep:ns-keyed-archive", "dep:uuid"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
plist = "1"
regex = "1"

idevice = { version = "=0.1.68", optional = true, default-features = false, features = [
  "core_device",
  "core_device_proxy",
  "display_stream",
  "dvt",
  "rsd",
  "xpc",
  "tcp",
  "usbmuxd",
  "installation_proxy",
  "springboardservices",
  "mobile_image_mounter",
  "remote_pairing",
  "rustcrypto",
] }
ns-keyed-archive = { version = "0.1", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
